[tools]
node = "24"
bun = "1.3"
uv = "latest"
python = "3.12"

[tasks.install]
description = "Install dependencies for both frontend and backend"
run = "bun install && (cd apps/api && uv sync)"

[tasks.setup]
description = "Install dependencies, Chromium, and the local demo fixture"
run = """
bun install
cd apps/api
uv sync
uv run playwright install chromium
uv run python scripts/import_demo_site.py
"""

[tasks.dev]
description = "Run all workspace applications in development mode"
run = "bun run dev"

[tasks."dev:web"]
description = "Run Next.js frontend only"
run = "bun --filter web dev"

[tasks."dev:api"]
description = "Run FastAPI backend only"
run = "bun --filter api dev"

[tasks."demo:import"]
description = "Import the bundled demo site into the local API store"
run = "cd apps/api && uv run python scripts/import_demo_site.py"

[tasks."modal:serve"]
description = "Serve the API and workers on Modal with hot reload"
run = "cd apps/api && uv run modal serve deploy.py"

[tasks."modal:deploy"]
description = "Deploy the API and workers to Modal"
run = "cd apps/api && uv run modal deploy deploy.py"

[tasks.build]
description = "Build all workspace applications"
run = "bun run build"

[tasks.lint]
description = "Lint all workspace applications"
run = "bun run lint"

[tasks."lint:fix"]
description = "Fix lint issues across workspace applications"
run = "bun run lint:fix"

[tasks.test]
description = "Run tests across all workspace applications"
run = "bun run test"

[tasks.typecheck]
description = "Type check all workspace applications"
run = "bun run typecheck"
