[project]
name = "abtract"
version = "0.1.0"
description = "A/B testing platform for AI agents: swarm a website, measure, let Gemini rewrite it, repeat."
requires-python = ">=3.12"
dependencies = [
    "modal>=1.0",
    "pydantic>=2.7",
    "openai>=1.50",
    "google-genai>=1.20",
    "httpx>=0.27",
    "playwright>=1.47",
    "fastapi[standard]>=0.115",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "markdownify>=0.13",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
include = ["abtract*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
